# Runs on every push: the API tests, copy rules and type check (make test), a check for
# known vulnerabilities in the app's packages (audit), then the browser journeys against
# the demo (make e2e) and against real accounts with demo mode off (make accounts).
# No secrets: everything runs on the in-memory database.
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: make setup
      - name: make test
        run: make test

  # Known vulnerabilities in the packages the app ships (not dev tools). Dependabot opens
  # the upgrade PRs; this fails the build until they're merged.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python packages (pip-audit)
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r backend/requirements.txt --progress-spinner off
      - name: Web app packages (npm audit)
        run: npm audit --omit=dev --audit-level=moderate
        working-directory: frontend

  browser:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          make setup
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Start the demo (API :8000, web :5173)
        run: |
          nohup node scripts/dev.mjs > dev.log 2>&1 &
          for i in $(seq 1 120); do
            curl -sf http://localhost:8000/api/health > /dev/null && curl -sf http://localhost:5173 > /dev/null && exit 0
            sleep 1
          done
          cat dev.log
          exit 1
      - name: make e2e (demo journeys)
        run: node qa/flows.mjs
      - name: make accounts (real accounts, demo mode off, 390 px and 1280 px)
        run: node qa/accounts.mjs
      - name: Keep failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: |
            qa/report/
            dev.log
          retention-days: 7
