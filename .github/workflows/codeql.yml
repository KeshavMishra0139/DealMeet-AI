# GitHub's code scanning (free for public repositories): looks for injection, unsafe
# redirects, leaked secrets in logs and similar bugs in the Python API and the web app.
# Findings appear under the repository's Security tab.
name: codeql

on:
  push:
    branches: [dealmeet-ai-codex-prototype-q4a93l]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
