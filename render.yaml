render-
# Render Blueprint: New > Blueprint, pick this repository, then Apply.
services:
  - type: web
    name: jodidar-ai
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      # The shared demo. Set DEMO_MODE to "0" for real accounts only (no personas, no reset).
      - key: DEMO_MODE
        value: "1"
      - key: DEMO_RESET_MINUTES
        value: "30"
      # In-memory database for the shared demo. For MongoDB Atlas: set USE_MOCK_DB to "0"
      # and add MONGODB_URI (and MONGODB_DB) as secret environment variables.
      - key: USE_MOCK_DB
        value: "1"
